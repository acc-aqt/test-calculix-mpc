[project]
name = "le10-thick-plate"
version = "0.1.0"
description = "NAFEMS LE10 thick plate under pressure in CalculiX vs the published σ_yy at point D"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
