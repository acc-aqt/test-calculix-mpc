[project]
name = "tube-cantilever"
version = "0.1.0"
description = "CHS 168.3 x 8 solid tube cantilever in CalculiX vs Timoshenko beam theory"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
